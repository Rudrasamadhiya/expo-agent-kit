<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3c52"/><stop offset="0.55" stop-color="#0b6d80"/><stop offset="1" stop-color="#3fd6e8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#12b5cb"/><stop offset="1" stop-color="#6d5cff"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#021820" flood-opacity="0.55"/></filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" fill-opacity="0.08"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <text x="800" y="120" text-anchor="middle" fill="#fff" font-size="62" font-weight="800" letter-spacing="-2">See exactly where you improve.</text>
  <g transform="translate(330 190)" filter="url(#sh)">
    <rect width="310" height="640" rx="52" fill="#0c0c14"/>
    <rect x="12" y="12" width="286" height="616" rx="42" fill="#f7f7fc"/>
    <rect x="115" y="26" width="80" height="20" rx="10" fill="#0c0c14"/>
    <text x="34" y="100" fill="#15151f" font-size="24" font-weight="800">Progress</text>
    <g font-size="14" fill="#15151f">
      <rect x="28" y="124" width="254" height="96" rx="18" fill="#fff" stroke="#e8e8f2"/>
      <text x="46" y="156" fill="#7a7a90">Accuracy</text><text x="46" y="196" font-size="32" font-weight="800">74%</text>
      <rect x="28" y="236" width="254" height="96" rx="18" fill="#6d5cff"/>
      <text x="46" y="268" fill="#fff" fill-opacity="0.8">Focus time</text><text x="46" y="308" font-size="32" font-weight="800" fill="#fff">18 h</text>
      <rect x="28" y="348" width="254" height="96" rx="18" fill="#fff" stroke="#e8e8f2"/>
      <text x="46" y="380" fill="#7a7a90">Streak</text><text x="46" y="420" font-size="32" font-weight="800">12 days</text>
      <rect x="28" y="460" width="254" height="140" rx="18" fill="#fff" stroke="#e8e8f2"/>
      <rect x="50" y="520" width="26" height="60" rx="6" fill="#e3e1ff"/><rect x="90" y="500" width="26" height="80" rx="6" fill="#e3e1ff"/>
      <rect x="130" y="540" width="26" height="40" rx="6" fill="#e3e1ff"/><rect x="170" y="490" width="26" height="90" rx="6" fill="#c9c3ff"/><rect x="210" y="480" width="26" height="100" rx="6" fill="#6d5cff"/>
    </g>
  </g>
  <path d="M650 445 C 720 445, 740 420, 800 420" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 10" stroke-opacity="0.7"/>
  <circle cx="650" cy="445" r="9" fill="#fff"/>
  <g transform="translate(800 230)" filter="url(#sh)">
    <rect width="500" height="520" rx="32" fill="#fff"/>
    <text x="40" y="70" fill="#15151f" font-size="30" font-weight="800">Focus time</text>
    <text x="40" y="104" fill="#7a7a90" font-size="18">Last 7 weeks</text>
    <line x1="40" y1="420" x2="460" y2="420" stroke="#eeeef6" stroke-width="2"/>
    <line x1="40" y1="330" x2="460" y2="330" stroke="#eeeef6" stroke-width="2"/>
    <line x1="40" y1="240" x2="460" y2="240" stroke="#eeeef6" stroke-width="2"/>
    <rect x="60" y="340" width="36" height="80" rx="9" fill="url(#bar)" opacity="0.45"/>
    <rect x="118" y="310" width="36" height="110" rx="9" fill="url(#bar)" opacity="0.5"/>
    <rect x="176" y="320" width="36" height="100" rx="9" fill="url(#bar)" opacity="0.55"/>
    <rect x="234" y="270" width="36" height="150" rx="9" fill="url(#bar)" opacity="0.65"/>
    <rect x="292" y="250" width="36" height="170" rx="9" fill="url(#bar)" opacity="0.75"/>
    <rect x="350" y="210" width="36" height="210" rx="9" fill="url(#bar)" opacity="0.85"/>
    <rect x="408" y="160" width="36" height="260" rx="9" fill="url(#bar)"/>
    <text x="40" y="470" fill="#7a7a90" font-size="16">Week 1</text><text x="460" y="470" fill="#7a7a90" font-size="16" text-anchor="end">Now</text>
    <g transform="translate(300 128)">
      <rect width="170" height="56" rx="28" fill="#e7fbf3"/>
      <text x="85" y="36" text-anchor="middle" fill="#0e9f6e" font-size="22" font-weight="800">▲ +38%</text>
    </g>
  </g>
  <text x="64" y="860" fill="#fff" fill-opacity="0.55" font-size="22" font-weight="600" letter-spacing="4">03 · SIDE-BY-SIDE</text>
</svg>
