      <rect x="58" y="20" width="110" height="10" rx="5" fill="#15151f"/><rect x="58" y="38" width="80" height="8" rx="4" fill="#c9c9d6"/>
      <rect x="15" y="66" width="202" height="7" rx="3.5" fill="#eeeef6"/><rect x="15" y="66" width="142" height="7" rx="3.5" fill="url(#acc)"/>
    </g>
  </g>
  <!-- player controls -->
  <circle cx="345" cy="636" r="20" fill="#2a2450"/><path d="M339 626 l16 10 -16 10z" fill="#fff"/>
  <rect x="384" y="632" width="700" height="8" rx="4" fill="#262636"/><rect x="384" y="632" width="290" height="8" rx="4" fill="url(#acc)"/>
  <circle cx="674" cy="636" r="9" fill="#fff"/>
  <text x="1160" y="641" text-anchor="end" fill="#8b8ca3" font-size="14">0:11 / 0:30</text>
