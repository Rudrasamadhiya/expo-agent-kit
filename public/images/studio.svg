  <text x="40" y="110" fill="#8b8ca3" font-size="13" font-weight="700" letter-spacing="2">SCENES</text>
  <g font-size="15" fill="#ececf4">
    <rect x="36" y="128" width="218" height="64" rx="12" fill="#1d1d2b"/><rect x="48" y="140" width="64" height="40" rx="7" fill="url(#c1)"/><text x="124" y="166">Intro</text>
    <rect x="36" y="204" width="218" height="64" rx="12" fill="#2a2450" stroke="#8f80ff" stroke-width="2"/><rect x="48" y="216" width="64" height="40" rx="7" fill="url(#prev)"/><text x="124" y="242" font-weight="700">Your week</text>
    <rect x="36" y="280" width="218" height="64" rx="12" fill="#1d1d2b"/><rect x="48" y="292" width="64" height="40" rx="7" fill="url(#c3)"/><text x="124" y="318">Progress</text>
    <rect x="36" y="356" width="218" height="64" rx="12" fill="#1d1d2b"/><rect x="48" y="368" width="64" height="40" rx="7" fill="url(#c1)"/><text x="124" y="394">Outro</text>
  </g>
