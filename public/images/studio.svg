    <text x="50" y="215" fill="#fff" font-size="40" font-weight="800">Everything due,</text>
    <text x="50" y="258" fill="#fff" font-size="40" font-weight="800">at a glance.</text>
    <rect x="50" y="278" width="116" height="4" rx="2" fill="#fff"/>
    <rect x="452" y="58" width="172" height="356" rx="28" fill="#0c0c14"/>
    <rect x="459" y="65" width="158" height="342" rx="23" fill="#f7f7fc"/>
    <g fill="#fff" stroke="#e8e8f2"><rect x="470" y="110" width="136" height="38" rx="9"/><rect x="470" y="200" width="136" height="38" rx="9"/><rect x="470" y="245" width="136" height="38" rx="9"/><rect x="470" y="290" width="136" height="38" rx="9"/></g>
