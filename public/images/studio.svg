  <rect x="20" y="884" width="1560" height="96" rx="16" fill="#15151f" stroke="#8f80ff" stroke-opacity="0.5"/>
  <text x="48" y="920" fill="#8b8ca3" font-size="13" font-weight="700" letter-spacing="2">PROMPT</text>
  <text x="48" y="955" fill="#ececf4" font-size="20">make the intro feel more premium and zoom into the Start button</text>
  <rect x="694" y="937" width="2" height="24" fill="#8f80ff"/>
  <rect x="1440" y="908" width="116" height="48" rx="12" fill="url(#acc)"/>
  <text x="1498" y="938" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Apply ↵</text>
</svg>
