  <rect x="1210" y="76" width="370" height="620" rx="16" fill="#15151f"/>
  <text x="1232" y="110" fill="#8b8ca3" font-size="13" font-weight="700" letter-spacing="2">SCENE</text>
  <g font-size="14" fill="#8b8ca3">
