    <rect x="1232" y="156" width="326" height="40" rx="9" fill="#0e0e17" stroke="#262636"/><text x="1246" y="181" fill="#ececf4">Everything due, at a glance.</text>
    <text x="1232" y="226">Duration</text>
    <rect x="1232" y="236" width="326" height="8" rx="4" fill="#262636"/><rect x="1232" y="236" width="180" height="8" rx="4" fill="#8f80ff"/><circle cx="1412" cy="240" r="9" fill="#fff"/>
    <text x="1558" y="226" text-anchor="end" fill="#ececf4">4.5 s</text>
    <text x="1232" y="280">Effect</text>
    <rect x="1232" y="290" width="104" height="36" rx="18" fill="#2a2450" stroke="#8f80ff"/><text x="1284" y="313" text-anchor="middle" fill="#fff" font-weight="700">Pop-out</text>
    <rect x="1344" y="290" width="104" height="36" rx="18" fill="#1d1d2b"/><text x="1396" y="313" text-anchor="middle">Zoom</text>
    <rect x="1456" y="290" width="102" height="36" rx="18" fill="#1d1d2b"/><text x="1507" y="313" text-anchor="middle">Split</text>
    <text x="1232" y="362">Sound</text>
    <g fill="#ff6bb5"><rect x="1232" y="384" width="5" height="16" rx="2"/><rect x="1242" y="376" width="5" height="32" rx="2"/><rect x="1252" y="380" width="5" height="24" rx="2"/><rect x="1262" y="370" width="5" height="44" rx="2"/><rect x="1272" y="382" width="5" height="20" rx="2"/><rect x="1282" y="388" width="5" height="8" rx="2"/></g>
    <text x="1300" y="397" fill="#ececf4">pop · whoosh · chime</text>
    <text x="1232" y="450">Format</text>
    <rect x="1232" y="460" width="104" height="36" rx="10" fill="#2a2450" stroke="#8f80ff"/><text x="1284" y="483" text-anchor="middle" fill="#fff" font-weight="700">16:9</text>
    <rect x="1344" y="460" width="104" height="36" rx="10" fill="#1d1d2b"/><text x="1396" y="483" text-anchor="middle">9:16</text>
    <rect x="1456" y="460" width="102" height="36" rx="10" fill="#1d1d2b"/><text x="1507" y="483" text-anchor="middle">1:1</text>
  </g>
  <!-- timeline -->
  <rect x="20" y="716" width="1560" height="150" rx="16" fill="#15151f"/>
  <g font-size="13" fill="#fff" font-weight="700">
    <rect x="40" y="740" width="250" height="56" rx="10" fill="url(#c1)"/><text x="56" y="773">Intro</text>
    <rect x="296" y="740" width="420" height="56" rx="10" fill="url(#prev)" stroke="#fff" stroke-width="2"/><text x="312" y="773">Your week · pop-out</text>
    <rect x="722" y="740" width="460" height="56" rx="10" fill="url(#c3)"/><text x="738" y="773">Progress · side-by-side</text>
    <rect x="1188" y="740" width="372" height="56" rx="10" fill="url(#c1)"/><text x="1204" y="773">Outro</text>
  </g>
  <g fill="#ff6bb5" opacity="0.8">
    <rect x="40" y="810" width="1520" height="34" rx="8" fill="#1d1d2b"/>
    <circle cx="120" cy="827" r="6"/><circle cx="330" cy="827" r="6"/><circle cx="470" cy="827" r="6"/><circle cx="760" cy="827" r="6"/><circle cx="910" cy="827" r="6"/><circle cx="1220" cy="827" r="6"/><circle cx="1400" cy="827" r="6"/>
  </g>
  <rect x="600" y="728" width="3" height="128" fill="#ff4d6d"/><path d="M593 722 h17 l-8.5 10z" fill="#ff4d6d"/>
