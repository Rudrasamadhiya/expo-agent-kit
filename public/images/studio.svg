<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="prev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ab8"/><stop offset="0.5" stop-color="#b13a8a"/><stop offset="1" stop-color="#3a0f3a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f80ff"/><stop offset="1" stop-color="#ff6bb5"/></linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2bb8"/><stop offset="1" stop-color="#1a1250"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b6d80"/><stop offset="1" stop-color="#3fd6e8"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="22" fill="#0e0e17"/>
  <!-- title bar -->
  <rect width="1600" height="56" rx="22" fill="#15151f"/><rect y="34" width="1600" height="22" fill="#15151f"/>
  <circle cx="34" cy="28" r="8" fill="#ff5f57"/><circle cx="60" cy="28" r="8" fill="#febc2e"/><circle cx="86" cy="28" r="8" fill="#28c840"/>
  <rect x="560" y="14" width="480" height="28" rx="14" fill="#0e0e17"/>
